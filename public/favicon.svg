<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Tandem">
  <!-- Tandem: two arms rising from one base, meeting at a shared glowing orb — working together. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcff"/>
      <stop offset="0.55" stop-color="#2d9bf0"/>
      <stop offset="1" stop-color="#0f63c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#c8ffb0" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#5fe0c0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#37c6e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f3ffe8"/>
      <stop offset="0.35" stop-color="#98ec6a"/>
      <stop offset="1" stop-color="#1f9a3c"/>
    </radialGradient>
    <linearGradient id="armA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcefff"/>
    </linearGradient>
    <linearGradient id="armB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fff0"/>
      <stop offset="1" stop-color="#cdf5bf"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#06386f" flood-opacity="0.35"/>
    </filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#sky)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>

  <!-- shared base -->
  <rect x="28" y="95" width="72" height="10" rx="5" fill="#ffffff" filter="url(#soft)"/>

  <!-- left arm (white) and right arm (leaf) mirror each other -->
  <g filter="url(#soft)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <path d="M45 96 L45 82 L34 56 L55 39" stroke="url(#armA)"/>
    <path d="M83 96 L83 82 L94 56 L73 39" stroke="url(#armB)"/>
  </g>
  <g filter="url(#soft)">
    <circle cx="45" cy="82" r="7.5" fill="#ffffff"/>
    <circle cx="34" cy="56" r="7.5" fill="#ffffff"/>
    <circle cx="83" cy="82" r="7.5" fill="#f4fff0"/>
    <circle cx="94" cy="56" r="7.5" fill="#f4fff0"/>
  </g>
  <circle cx="45" cy="82" r="3" fill="#2d9bf0"/>
  <circle cx="34" cy="56" r="3" fill="#2d9bf0"/>
  <circle cx="83" cy="82" r="3" fill="#2fb84a"/>
  <circle cx="94" cy="56" r="3" fill="#2fb84a"/>

  <!-- grippers cradling the shared orb -->
  <g fill="none" stroke-linecap="round" stroke-width="5" filter="url(#soft)">
    <path d="M53 41 Q52 31 58 26" stroke="#ffffff"/>
    <path d="M75 41 Q76 31 70 26" stroke="#f4fff0"/>
  </g>
  <circle cx="64" cy="31" r="12" fill="#b8ff9a" opacity="0.55" filter="url(#halo)"/>
  <circle cx="64" cy="31" r="9" fill="url(#orb)"/>
  <ellipse cx="61" cy="27.5" rx="4" ry="2.4" fill="#fff" opacity="0.8"/>

  <!-- glass gloss -->
  <path d="M8 34 Q8 8 34 8 H94 Q120 8 120 34 V44 Q64 60 8 44 Z" fill="url(#gloss)" opacity="0.5"/>
</svg>
